name: Deploy to Production

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Установка cloudflared на стороне GitHub Actions
      - name: Install Cloudflared
        run: |
          # Скачиваем бинарный файл напрямую (он универсален для Linux x86_64)
          curl -L --output cloudflared https://github.com
          # Даем права на исполнение
          chmod +x cloudflared
          # Переносим в системную папку
          sudo mv cloudflared /usr/local/bin/
          # Проверяем установку
          cloudflared --version

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # 2. Настройка SSH для использования туннеля
      - name: Configure SSH Proxy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Эта команда заставляет SSH использовать cloudflared для подключения к вашему хосту
          echo "Host ${HOST}" >> ~/.ssh/config
          echo "  ProxyCommand cloudflared access ssh --hostname %h" >> ~/.ssh/config
          
          # Сканируем ключи через прокси
          ssh-keyscan -v -t ed25519 ${HOST} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts ~/.ssh/config

      - name: Test SSH connection
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Testing SSH connection via Cloudflare Tunnel..."
          # Добавляем -o StrictHostKeyChecking=no на случай проблем с keyscan
          ssh -v -o StrictHostKeyChecking=no ${USER}@${HOST} "echo 'SSH connection successful!'"

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=no ${USER}@${HOST} bash -s -- <<EOF
            set -e
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Переходим в папку проекта
            cd "${APP_PATH}"
            
            echo "[INFO] Current directory: \$(pwd)"
            echo "[INFO] Fetching code..."
            git fetch origin production
            git reset --hard origin/production

            echo "[INFO] Setting up Docker Buildx..."
            if ! docker buildx version &> /dev/null; then
              echo "[INFO] Docker Buildx not found, installing..."
              mkdir -p ~/.docker/cli-plugins
              curl -SL https://github.com/docker/buildx/releases/download/v0.12.1/buildx-v0.12.1.linux-amd64 -o ~/.docker/cli-plugins/docker-buildx
              chmod +x ~/.docker/cli-plugins/docker-buildx
            fi
            
            echo "[INFO] Stopping and removing old containers..."
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi
            
            \${COMPOSE_CMD} down || true
            docker rm -f setrep-api setrep-bot setrep-miniapp setrep-postgres 2>/dev/null || true
            
            echo "[INFO] Pull images/build and restart..."
            \${COMPOSE_CMD} pull || true
            \${COMPOSE_CMD} up -d --build

            echo "[INFO] Cleanup old images..."
            docker image prune -f
