name: Deploy to Production

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Установка cloudflared на стороне GitHub Actions
      - name: Install Cloudflared
        run: |
          # 1. Добавляем GPG‑ключ репозитория Cloudflare (официальная инструкция)
          sudo mkdir -p --mode=0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null

          # 2. Добавляем репозиторий для Ubuntu 24.04 (noble), который сейчас использует ubuntu-latest
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared noble main" | sudo tee /etc/apt/sources.list.d/cloudflared.list

          # 3. Устанавливаем cloudflared
          sudo apt-get update
          sudo apt-get install -y cloudflared

          # 4. Проверяем работоспособность
          cloudflared --version

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # 2. Настройка SSH для использования туннеля
      - name: Configure SSH Proxy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -e

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          # Эта конфигурация заставляет SSH использовать cloudflared для подключения к вашему хосту
          {
            echo "Host ${HOST}"
            # apt‑пакет устанавливает cloudflared как /usr/bin/cloudflared, поэтому без /usr/local/bin
            echo "  ProxyCommand cloudflared access ssh --hostname %h"
          } >> "$HOME/.ssh/config"
          
          # Сканируем ключи; если по какой‑то причине не получилось, не роняем пайплайн
          ssh-keyscan -v -t ed25519 "${HOST}" >> "$HOME/.ssh/known_hosts" 2>/dev/null || echo "ssh-keyscan failed, continuing without strict host key check"
          chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/config" || true

      - name: Test SSH connection
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
        run: |
          echo "Testing SSH connection via Cloudflare Tunnel..."
          # Используем только ключ из ssh-agent, отключаем password / keyboard-interactive
          ssh -v \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            ${USER}@${HOST} "echo 'SSH connection successful!'"

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          APP_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            ${USER}@${HOST} bash -s -- <<EOF
            set -e
            export DOCKER_BUILDKIT=1
            export COMPOSE_DOCKER_CLI_BUILD=1
            
            # Переходим в папку проекта
            cd "${APP_PATH}"
            
            echo "[INFO] Current directory: \$(pwd)"
            echo "[INFO] Fetching code..."
            git fetch origin production
            git reset --hard origin/production

            echo "[INFO] Setting up Docker Buildx..."
            if ! docker buildx version &> /dev/null; then
              echo "[INFO] Docker Buildx not found, installing..."
              mkdir -p ~/.docker/cli-plugins
              curl -SL https://github.com/docker/buildx/releases/download/v0.12.1/buildx-v0.12.1.linux-amd64 -o ~/.docker/cli-plugins/docker-buildx
              chmod +x ~/.docker/cli-plugins/docker-buildx
            fi
            
            echo "[INFO] Stopping and removing old containers..."
            if docker compose version &> /dev/null; then
              COMPOSE_CMD="docker compose"
            else
              COMPOSE_CMD="docker-compose"
            fi
            
            \${COMPOSE_CMD} down || true
            docker rm -f setrep-api setrep-bot setrep-miniapp setrep-postgres 2>/dev/null || true
            
            echo "[INFO] Pull images/build and restart..."
            \${COMPOSE_CMD} pull || true
            \${COMPOSE_CMD} up -d --build

            echo "[INFO] Cleanup old images..."
            docker image prune -f
