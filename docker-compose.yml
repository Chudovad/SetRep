services:
  postgres:
    image: postgres:16-alpine
    container_name: setrep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SetRepDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - setrep-network

  api:
    build:
      context: .
      dockerfile: SetRep.API/Dockerfile
    container_name: setrep-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-SetRepDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-localdb}
      - BotToken=${BOT_TOKEN}
      - Jwt__SecretKey=${JWT_SECRET_KEY:-your-secret-key-here-change-in-production-min-32-characters}
      - YANDEX_OBJECT_STORAGE_ACCESS_KEY=${YANDEX_OBJECT_STORAGE_ACCESS_KEY}
      - YANDEX_OBJECT_STORAGE_SECRET_KEY=${YANDEX_OBJECT_STORAGE_SECRET_KEY}
      - YANDEX_OBJECT_STORAGE_ENDPOINT=${YANDEX_OBJECT_STORAGE_ENDPOINT:-https://storage.yandexcloud.net}
      - YANDEX_OBJECT_STORAGE_BUCKET_NAME=${YANDEX_OBJECT_STORAGE_BUCKET_NAME}
      - YANDEX_OBJECT_STORAGE_SERVICE_URL=${YANDEX_OBJECT_STORAGE_SERVICE_URL:-https://storage.yandexcloud.net}
    ports:
      - "${API_HTTP_PORT:-5181}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - setrep-network

  bot:
    build:
      context: .
      dockerfile: SetRep.Bot/Dockerfile
    container_name: setrep-bot
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BotToken=${BOT_TOKEN}
      - BotWebhookUrl=${BOT_WEBHOOK_URL}
      - ApiBaseUrl=${API_BASE_URL:-http://api:8080}
    ports:
      - "${BOT_HTTP_PORT:-5083}:8080"
    depends_on:
      - api
    networks:
      - setrep-network

  miniapp:
    build:
      context: .
      dockerfile: SetRep.MiniApp/SetRep.MiniApp/Dockerfile
    container_name: setrep-miniapp
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiBaseUrl=${API_BASE_URL:-http://api:8080}
    ports:
      - "${MINIAPP_HTTP_PORT:-5096}:8080"
    depends_on:
      - api
    networks:
      - setrep-network

  # Полный бэкап всего кластера PostgreSQL (pg_dumpall: все БД, роли, права).
  # Пишет в папку на хосте — укажите POSTGRES_BACKUP_DIR внутри каталога Яндекс.Диска.
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: setrep-postgres-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      # Служебная БД только для подключения; при POSTGRES_CLUSTER дампятся все базы
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdb}
      POSTGRES_CLUSTER: "TRUE"
      POSTGRES_EXTRA_OPTS: ""
      SCHEDULE: ${POSTGRES_BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${POSTGRES_BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${POSTGRES_BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${POSTGRES_BACKUP_KEEP_MONTHS:-6}
      BACKUP_ON_START: ${POSTGRES_BACKUP_ON_START:-TRUE}
      BACKUP_LATEST_TYPE: none
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ${POSTGRES_BACKUP_DIR:-./backups/postgres}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - setrep-network

volumes:
  postgres_data:

networks:
  setrep-network:
    driver: bridge
