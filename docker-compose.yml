version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: setrep-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-SetRepDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-7d81f16a-51cb-4ed3-8eb3-13a4dec282b4}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - setrep-network

  api:
    build:
      context: .
      dockerfile: SetRep.API/Dockerfile
    container_name: setrep-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-SetRepDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-7d81f16a-51cb-4ed3-8eb3-13a4dec282b4}
      - BotToken=${BOT_TOKEN}
    ports:
      - "${API_HTTP_PORT:-5181}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - setrep-network

  bot:
    build:
      context: .
      dockerfile: SetRep.Bot/Dockerfile
    container_name: setrep-bot
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - BotToken=${BOT_TOKEN}
      - BotWebhookUrl=${BOT_WEBHOOK_URL}
    ports:
      - "${BOT_HTTP_PORT:-5083}:8080"
    depends_on:
      - api
    networks:
      - setrep-network

  miniapp:
    build:
      context: .
      dockerfile: SetRep.MiniApp/SetRep.MiniApp/Dockerfile
    container_name: setrep-miniapp
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ApiBaseUrl=${API_BASE_URL:-http://api:8080}
    ports:
      - "${MINIAPP_HTTP_PORT:-5096}:8080"
    depends_on:
      - api
    networks:
      - setrep-network

volumes:
  postgres_data:

networks:
  setrep-network:
    driver: bridge
